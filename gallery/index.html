<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf3e9">
  <meta name="description" content="Photos and videos from Bhuvan and Manasa's wedding celebrations.">
  <title>Celebration Album | Bhuvan &amp; Manasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20261002-17">
  <link rel="stylesheet" href="/pages.css?v=20261002-06">
  <script src="/pages.js?v=20261002-07" defer></script>
  <script src="/language.js?v=20261005-1" defer></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const audio = document.getElementById('galleryMusic');
      const btn = document.getElementById('galleryMusicToggle');
      if (!audio || !btn) return;
      let started = false;

      function syncButton() {
        const playing = !audio.paused && !audio.ended;
        btn.textContent = playing ? '⏸' : '▶';
        btn.setAttribute('aria-pressed', String(playing));
        btn.setAttribute('aria-label', playing ? 'Pause gallery music' : 'Play gallery music');
      }
      audio.addEventListener('play', syncButton);
      audio.addEventListener('pause', syncButton);

      async function play() {
        try {
          audio.volume = 0.6;
          await audio.play();
          started = true;
          syncButton();
        } catch (e) { /* autoplay blocked by browser */ }
      }

      // Try to start immediately when the gallery opens
      play();
      window.addEventListener('pageshow', play);

      // Fallbacks in case the browser blocks autoplay
      document.addEventListener('pointerdown', function startOnce(e) {
        if (e.target === btn) return;
        if (!started) play();
        if (started) document.removeEventListener('pointerdown', startOnce);
      });
      document.addEventListener('touchend', function t() { if (!started) play(); else document.removeEventListener('touchend', t); });
      document.addEventListener('keydown', function k() { if (!started) play(); else document.removeEventListener('keydown', k); });

      btn.addEventListener('click', function () {
        if (audio.paused) {
          const videosPanel = document.getElementById('videosPanel');
          if (videosPanel && !videosPanel.hidden) return; // no background music on Videos tab
          play();
        } else {
          audio.pause();
          started = true;
          syncButton();
        }
      });
    });
  </script>
</head>
<body class="standalone-page gallery-page">
  <nav class="floating-nav" aria-label="Invitation navigation">
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">☾</button>
    <a href="https://bhuvanmanasa.in/#home">శుభారంభం</a>
    <a href="https://bhuvanmanasa.in/#story">వధూవరులు</a>
    <a href="https://bhuvanmanasa.in/#events">శుభకార్యాలు</a>
    <a href="https://bhuvanmanasa.in/#venue">కళ్యాణ వేదిక</a>
    <a href="/gallery/" aria-current="page">గ్యాలరీ</a>
    <a href="/live/">లైవ్</a>
  </nav>

  <header class="gallery-hero">
    <img src="/assets/Gallery-pics.png" alt="Bhuvan and Manasa wedding celebration collage" fetchpriority="high" decoding="async" width="1933" height="814">
  </header>

  <main class="album-main">
    <div class="album-heading">
      <p class="eyebrow">A FEW MOMENTS OF JOY</p>
      <h2>Celebration Memories</h2>
    </div>

    <div class="album-tabs" role="tablist" aria-label="Album media">
      <button id="photosTab" type="button" role="tab" aria-controls="photosPanel" aria-selected="true" data-album-tab="photos">Photos <span data-gallery-count>12</span></button>
      <button id="videosTab" type="button" role="tab" aria-controls="videosPanel" aria-selected="false" data-album-tab="videos" tabindex="-1">Videos</button>
    </div>

    <section id="photosPanel" class="album-panel" role="tabpanel" aria-labelledby="photosTab" data-album-panel="photos">
      <div id="dynamicCollage" class="dynamic-collage" aria-live="polite"></div>
    </section>

    <section id="videosPanel" class="album-panel video-panel" role="tabpanel" aria-labelledby="videosTab" data-album-panel="videos" hidden>
      <div id="albumVideoGrid" class="album-video-grid"></div>
      <p id="videoEmptyState" class="album-empty">Wedding videos will appear here.</p>
    </section>
  </main>

  <dialog class="photo-lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" aria-label="Close photo">×</button>
    <button class="lightbox-step lightbox-previous" type="button" aria-label="Previous photo">‹</button>
    <figure>
      <img class="lightbox-image" alt="">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-step lightbox-next" type="button" aria-label="Next photo">›</button>
  </dialog>

  <audio id="galleryMusic" src="/assets/blue-instrumental.mp3" loop autoplay preload="auto"></audio>
  <button id="galleryMusicToggle" class="music-toggle" type="button" aria-label="Play gallery music" aria-pressed="false">▶</button>

  <dialog class="video-lightbox" aria-label="Video player">
    <button class="video-lightbox-close" type="button" aria-label="Close video">×</button>
    <video class="lightbox-video" controls playsinline preload="metadata"></video>
  </dialog>

  <footer class="album-footer">
    <a href="https://bhuvanmanasa.in/">Bhuvan &amp; Manasa</a>
    <span>12 December 2026</span>
  </footer>
</body>
</html>
