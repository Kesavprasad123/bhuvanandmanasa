<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fbf3e9">
  <meta name="description" content="Photos and videos from Bhuvan and Manasa's wedding celebrations.">
  <title>Celebration Album | Bhuvan &amp; Manasa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Great+Vibes&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css?v=20261002-01">
  <link rel="stylesheet" href="/pages.css?v=20261001-7">
  <script src="/pages.js?v=20261001-2" defer></script>
</head>
<body class="standalone-page gallery-page">
  <nav class="floating-nav" aria-label="Invitation navigation">
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" aria-pressed="false">☾</button>
    <a href="https://bhuvanmanasa.in/#home">శుభారంభం</a>
    <a href="https://bhuvanmanasa.in/#story">వధూవరులు</a>
    <a href="https://bhuvanmanasa.in/#events">శుభకార్యాలు</a>
    <a href="https://bhuvanmanasa.in/#venue">కళ్యాణ వేదిక</a>
    <a href="/gallery/" aria-current="page">గ్యాలరీ</a>
    <a href="/live/">లైవ్</a>
  </nav>

  <header class="gallery-hero">
    <img src="/assets/Gallery-pics.png" alt="Bhuvan and Manasa wedding celebration collage" fetchpriority="high" decoding="async" width="1933" height="814">
  </header>

  <main class="album-main">
    <div class="album-heading">
      <p class="eyebrow">A FEW MOMENTS OF JOY</p>
      <h2>Celebration Memories</h2>
    </div>

    <div class="album-tabs" role="tablist" aria-label="Album media">
      <button id="photosTab" type="button" role="tab" aria-controls="photosPanel" aria-selected="true" data-album-tab="photos">Photos <span>08</span></button>
      <button id="videosTab" type="button" role="tab" aria-controls="videosPanel" aria-selected="false" data-album-tab="videos" tabindex="-1">Videos</button>
    </div>

    <section id="photosPanel" class="album-panel" role="tabpanel" aria-labelledby="photosTab" data-album-panel="photos">
      <div class="album-photo-grid">
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I9462.jpg" data-caption="Pelli Koduku" data-rotation="-90">
          <img src="/assets/gallery/A25I9462.jpg" alt="Pelli Koduku celebration" loading="lazy" decoding="async" width="1800" height="1200">
          <span>1</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I8942.jpg" data-caption="Haldi celebration" data-rotation="-90">
          <img src="/assets/gallery/A25I8942.jpg" alt="Haldi celebration" loading="lazy" decoding="async" width="1800" height="1200">
          <span>2</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I9111.jpg" data-caption="Mehendi celebration" data-rotation="-90" data-crop="right">
          <img src="/assets/gallery/A25I9111.jpg" alt="Mehendi celebration" loading="lazy" decoding="async" width="1800" height="1200">
          <span>3</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I9163.jpg" data-caption="Wedding celebration">
          <img src="/assets/gallery/A25I9163.jpg" alt="Wedding celebration" loading="lazy" decoding="async" width="1800" height="1200">
          <span>4</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I9108.jpg" data-caption="A wedding moment" data-rotation="-90" data-crop="right">
          <img src="/assets/gallery/A25I9108.jpg" alt="A wedding moment" loading="lazy" decoding="async" width="1800" height="1200">
          <span>5</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I8862.jpg" data-caption="With family" data-rotation="-90">
          <img src="/assets/gallery/A25I8862.jpg" alt="Bhuvan and Manasa with family" loading="lazy" decoding="async" width="1800" height="1200">
          <span>6</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I8939.jpg" data-caption="A joyful moment" data-rotation="-90">
          <img src="/assets/gallery/A25I8939.jpg" alt="A joyful wedding moment" loading="lazy" decoding="async" width="1800" height="1200">
          <span>7</span>
        </button>
        <button class="album-photo" type="button" data-photo="/assets/gallery/A25I8946.jpg" data-caption="Together with loved ones">
          <img src="/assets/gallery/A25I8946.jpg" alt="Bhuvan and Manasa with loved ones" loading="lazy" decoding="async" width="1800" height="1273">
          <span>8</span>
        </button>
      </div>
    </section>

    <section id="videosPanel" class="album-panel video-panel" role="tabpanel" aria-labelledby="videosTab" data-album-panel="videos" hidden>
      <div id="albumVideoGrid" class="album-video-grid"></div>
      <p id="videoEmptyState" class="album-empty">Wedding videos will appear here.</p>
    </section>
  </main>

  <dialog class="photo-lightbox" aria-label="Photo viewer">
    <button class="lightbox-close" type="button" aria-label="Close photo">×</button>
    <button class="lightbox-step lightbox-previous" type="button" aria-label="Previous photo">‹</button>
    <figure>
      <img class="lightbox-image" alt="">
      <figcaption class="lightbox-caption"></figcaption>
    </figure>
    <button class="lightbox-step lightbox-next" type="button" aria-label="Next photo">›</button>
  </dialog>

  <footer class="album-footer">
    <a href="https://bhuvanmanasa.in/">Bhuvan &amp; Manasa</a>
    <span>12 December 2026</span>
  </footer>
</body>
</html>
